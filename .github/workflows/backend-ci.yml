
name: Backend CI

on:
  push:
    branches:
      - main
      - infrastructure
      - backend
      - feature/scan-findings
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: FastAPI and PostgreSQL tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: securescope
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: securescope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U securescope -d securescope_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://securescope:ci_test_password@localhost:5432/securescope_test
      JWT_SECRET_KEY: ci_only_test_secret_not_for_production_123456
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      PYTHONPATH: ${{ github.workspace }}/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -v -o cache_dir=/tmp/pytest_cache
